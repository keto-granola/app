name: Smoke Test

on:
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build and start
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for app healthy
        run: |
          docker compose -f docker-compose.ci.yml logs -f keto-granola-app &
          timeout 120 bash -c \
          'until [ "$(docker inspect --format={{.State.Health.Status}} keto-granola-app)" = "healthy" ]; do sleep 2; done'

      - name: Smoke test
        run: curl --fail http://localhost:3001/api/v1/health

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml logs keto-granola-app
          docker compose -f docker-compose.ci.yml down -v